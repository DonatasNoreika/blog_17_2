{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans 'Search Results' %}{% endblock %}

{% block content %}

<h1>{% trans 'Search Results' %}</h1>
<p>{% trans 'Search results by query' %} "{{ query }}"?</p>
{% for post in posts %}
<p><a href="{% url 'post' post.pk %}">{{ post.title }}</a></p>
{% endfor %}
{% endblock %}
