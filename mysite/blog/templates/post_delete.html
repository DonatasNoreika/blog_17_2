{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans 'Post delete' %}{% endblock %}

{% block content %}
<p>{% trans 'Are you sure you want to delete the post' %} "{{ post.title }}"?</p>
<form method="post">
    {% csrf_token %}
    {% load crispy_forms_tags %}
    <button type="submit" class="btn btn-primary">{% trans 'YES' %}</button>
    <a class="btn btn-secondary" href="{% url 'post' post.pk %}">{% trans 'NO' %}</a>
</form>

{% endblock %}
