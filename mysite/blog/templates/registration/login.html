{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans 'Login' %}{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}
    {% load crispy_forms_tags %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary">{% trans 'Login' %}</button>
</form>
<p><a href="{% url 'password_reset' %}" class="btn btn-link w-100">{% trans 'Forgot Password?' %}?</a></p>

{% endblock %}
