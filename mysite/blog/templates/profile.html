{% extends 'base.html' %}

{% block title %}Vartotojo profilis{% endblock %}

{% block content %}
<h1>Vartotojo profilis</h1>
<p>{{ user.first_name }}</p>
<p>{{ user.last_name }}</p>
<p>{{ user.email }}</p>
<hr>
<form method="post">

    {{ form | crispy }}
    <button type="submit" class="btn btn-primary">Atnaujinti</button>
</form>

{% endblock %}
