{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans 'Sign Up' %}{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}
    {% load crispy_forms_tags %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary">{% trans 'Sign Up' %}</button>
</form>

{% endblock %}
